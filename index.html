<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公交车次分析系统</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            color: white;
            padding: 40px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        .search-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            gap: 20px;
            align-items: end;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input:focus {
            border: 2px solid #3b82f6;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }

        .table-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 900px;
        }

        th {
            background: rgba(59,130,246,0.2);
            color: #93c5fd;
            padding: 14px;
            text-align: center;
            font-size: 15px;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #f1f5f9;
            transition: 0.2s;
        }

        tr:hover td {
            background: rgba(255,255,255,0.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #93c5fd;
            font-size: 18px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #fca5a5;
            font-size: 18px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        @media(max-width:900px){

            .search-card{
                flex-direction: column;
                align-items: stretch;
            }

            button{
                width:100%;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            班表自动生成
        </div>

        <div class="subtitle">
            Bus Schedule Analytics Platform
        </div>

        <div class="search-card">

            <div class="input-group">
                <label>公交线路</label>
                <input id="route" placeholder="例如：525">
            </div>

            <div class="input-group">
                <label>运营日期</label>
                <input id="date" type="date">
            </div>

            <button onclick="searchBus()">
                查询数据
            </button>

        </div>

        <div class="table-card">

            <div id="tableContainer">

                <div class="loading">
                    请输入线路并点击查询
                </div>

            </div>

        </div>

        <div class="footer">
            Powered by Flask + Render + GitHub Pages
        </div>

    </div>

    <script>

        async function searchBus(){

            let route = document.getElementById("route").value;

            let date = document.getElementById("date").value;

            if(!route || !date){

                alert("请输入线路和日期");

                return;
            }

            document.getElementById("tableContainer").innerHTML =
            `
                <div class="loading">
                    正在加载车辆数据...
                </div>
            `;

            try{

                let url =
                `https://banci-4o6a.onrender.com/api/bus?route=${route}&date=${date}`;

                let response = await fetch(url);

                let data = await response.json();

                if(data.length === 0){

                    document.getElementById("tableContainer").innerHTML =
                    `
                        <div class="empty">
                            未查询到数据
                        </div>
                    `;

                    return;
                }

                let table = "<table>";

                table += "<tr>";

                Object.keys(data[0]).forEach(key=>{

                    table += `<th>${key}</th>`;

                });

                table += "</tr>";

                data.forEach(row=>{

                    table += "<tr>";

                    Object.values(row).forEach(value=>{

                        table += `<td>${value}</td>`;

                    });

                    table += "</tr>";

                });

                table += "</table>";

                document.getElementById("tableContainer").innerHTML = table;

            }
            catch(error){

                document.getElementById("tableContainer").innerHTML =
                `
                    <div class="empty">
                        数据加载失败
                    </div>
                `;

            }

        }

    </script>

</body>

</html>
