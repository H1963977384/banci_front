<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时刻表查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom-dark { background-color: #1a2a3a; }
        .table-stripe:nth-child(even) { background-color: #fff7ed; }
        .table-stripe:nth-child(odd) { background-color: #ffffff; }
        .first-last-run { color: #ff4d4f; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="bg-custom-dark text-white py-6 text-center shadow-lg">
        <h1 id="title_line" class="text-3xl font-bold tracking-widest">线路运行时刻表</h1>
        <p class="text-sm opacity-70 mt-2">📅 公交车运行时刻查询系统</p>
    </div>

    <div class="max-w-7xl mx-auto mt-6 px-4">
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-wrap gap-4 items-end mb-6">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm text-gray-600 mb-1">线路编号</label>
                <input type="text" id="routeInput" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none" value="525">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm text-gray-600 mb-1">选择日期</label>
                <input type="date" id="dateInput" class="w-full border rounded p-2" value="{{ today }}">
            </div>
            <button onclick="fetchData()" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-2 rounded transition shadow">🔍 查询</button>
            <div class="ml-auto text-right border-l pl-6 hidden md:block">
                <p class="text-gray-400 text-xs">运行日期</p>
                <p id="displayDate" class="text-red-500 font-bold">{{ today }}</p>
            </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="w-full border-collapse text-sm text-center">
                <thead>
                    <tr class="border-b" id="headerRow0">
                        <th rowspan="2" class="p-3 border-r bg-gray-50 w-20">班别</th>
                        <th id="up_name" colspan="0" class="p-2 bg-gray-50 text-red-600 border-r">上行站</th>
                        <th id="down_name" colspan="0" class="p-2 bg-gray-50 text-red-600">下行站</th>
                    </tr>
                    <tr class="border-b bg-gray-50" id="headerRow1">
                        </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
        <p class="mt-4 text-xs text-gray-400">注：<span class="text-red-500">红色</span>为首班车或尾班车时间</p>
    </div>

    <script>
        async function fetchData() {
            const route = document.getElementById('routeInput').value;
            const date = document.getElementById('dateInput').value;
            document.getElementById('displayDate').innerText = date;
            document.getElementById('title_line').innerText = `${route}路运行时刻表`;

            const resp = await fetch(`/api/timetable?route=${route}&date=${date}`);
            const data = await resp.json();

            if (data.error) { alert(data.error); return; }

            // 更新表头
            document.getElementById('up_name').innerText = `${data.up_station}`;
            document.getElementById('up_name').colSpan = data.max_up;
            document.getElementById('down_name').innerText = `${data.down_station}`;
            document.getElementById('down_name').colSpan = data.max_down;

            let h1 = "";
            for(let i=1; i<=data.max_up; i++) h1 += `<th class="p-2 border-r w-20">${i}</th>`;
            for(let i=1; i<=data.max_down; i++) h1 += `<th class="p-2 border-r w-20">${i}</th>`;
            document.getElementById('headerRow1').innerHTML = h1;

            // 更新表格内容
            let html = "";
            data.table_data.forEach((row, index) => {
                html += `<tr class="table-stripe border-b">
                    <td class="p-3 border-r font-medium">${index + 1}</td>
                    <td class="p-3 border-r text-gray-400">-</td>`;
                
                row.up_times.forEach(t => {
                    html += `<td class="p-2 border-r ${t.startsWith('06') || t.startsWith('21') ? 'text-red-500 font-bold' : ''}">${t}</td>`;
                });
                row.down_times.forEach(t => {
                    html += `<td class="p-2 border-r ${t.startsWith('06') || t.startsWith('21') ? 'text-red-500 font-bold' : ''}">${t}</td>`;
                });
                html += `</tr>`;
            });
            document.getElementById('tableBody').innerHTML = html;
        }
        
        // 页面加载后自动点击一次查询
        window.onload = fetchData;
    </script>
</body>
</html>
