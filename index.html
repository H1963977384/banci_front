<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时刻表查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom-dark { background-color: #1a2a3a; }
        
        /* 直接针对 tbody 里的偶数行设置背景色 */
        /* 这样可以确保整行（包括第一列）统一变色 */
        #tableBody tr:nth-child(even) { 
            background-color: #FFC000 !important; 
        }
        
        #tableBody tr:nth-child(odd) { 
            background-color: #ffffff; 
        }
    
        /* 这里的边框颜色如果太深，可以微调 */
        .border-r { border-right-width: 1px; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="bg-custom-dark text-white py-6 text-center shadow-lg">
        <h1 id="title_line" class="text-3xl font-bold tracking-widest">📅 珠海公交运行时刻查询</h1>
    </div>

    <div class="max-w-7xl mx-auto mt-6 px-4 pb-12">
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-wrap gap-4 items-end mb-6">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm text-gray-600 mb-1">线路编号</label>
                <input type="text" id="routeInput" 
                       class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none" 
                       placeholder="请输入线路号" 
                       value="">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm text-gray-600 mb-1">选择日期 (3个月)</label>
                <input type="date" id="dateInput" class="w-full border rounded p-2">
            </div>
            <button id="searchBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-2 rounded transition shadow">🔍 查询</button>
            <div class="ml-auto text-right border-l pl-6 hidden md:block">
                <p class="text-gray-400 text-xs">运行日期</p>
                <p id="displayDate" class="text-red-500 font-bold"></p>
            </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="w-full border-collapse text-sm text-center">
                <thead>
                    <tr class="bg-gray-100 border-b">
                        <th id="main_title" colspan="3" class="p-3 text-lg font-bold text-gray-700">请在上方输入线路号并点击查询</th>
                    </tr>
                    <tr class="border-b" id="headerRow0">
                        <th rowspan="2" class="p-3 border-r bg-gray-50 w-20">班别</th>
                        <th id="up_name" colspan="1" class="p-2 bg-gray-50 text-blue-800 border-r">上行方向</th>
                        <th id="down_name" colspan="1" class="p-2 bg-gray-50 text-blue-800">下行方向</th>
                    </tr>
                    <tr class="border-b bg-gray-50" id="headerRow1">
                        <th class="p-2 border-r bg-gray-50">-</th>
                        <th class="p-2 bg-gray-50">-</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="3" class="p-12 text-gray-400">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
        <p class="mt-4 text-xs text-gray-400 text-center">数据仅供参考，请以实际发车时间为准</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
