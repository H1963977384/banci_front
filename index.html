<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公交车次分析系统</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:40px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.title{
    font-size:42px;
    font-weight:bold;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.search-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    display:flex;
    gap:20px;
    align-items:end;
    margin-bottom:25px;
}

.input-group{
    flex:1;
}

label{
    display:block;
    margin-bottom:8px;
    color:#e2e8f0;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
}

.table-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:20px;
    overflow-x:auto;
}

/* ===== 表格样式 ===== */
table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
    text-align:center;
}

th{
    padding:12px;
    background:rgba(255,255,255,0.08);
    color:#93c5fd;
    border:1px solid rgba(255,255,255,0.1);
}

td{
    padding:12px;
    border:1px solid rgba(255,255,255,0.08);
}

/* ✔ 奇偶行颜色 */
tbody tr:nth-child(odd){
    background:white;
    color:black;
}

tbody tr:nth-child(even){
    background:#f59e0b;
    color:black;
}

.right-box{
    position:absolute;
    right:40px;
    top:40px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:10px 20px;
    border-radius:12px;
}

.loading,.empty{
    text-align:center;
    padding:30px;
    color:#93c5fd;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">Z123路运行时刻表</div>
    <div class="subtitle">公交车运行时刻查询系统</div>

    <div class="right-box">
        <div>运行日期</div>
        <div id="runDate" style="color:red;font-weight:bold;">--</div>
    </div>

    <div class="search-card">

        <div class="input-group">
            <label>线路编号</label>
            <input id="route" placeholder="Z123">
        </div>

        <div class="input-group">
            <label>选择日期</label>
            <input id="date" type="date">
        </div>

        <button onclick="searchBus()">查询</button>

    </div>

    <div class="table-card">

        <div id="tableContainer">
            <div class="loading">请输入线路并查询</div>
        </div>

    </div>

</div>

<script>

async function searchBus(){

    let route = document.getElementById("route").value;
    let date = document.getElementById("date").value;

    if(!route || !date){
        alert("请输入线路和日期");
        return;
    }

    document.getElementById("runDate").innerText = date;

    document.getElementById("tableContainer").innerHTML =
    `<div class="loading">加载中...</div>`;

    try{

        let url = `https://banci-4o6a.onrender.com/api/bus?route=${route}&date=${date}`;

        let res = await fetch(url);
        let result = await res.json();
        
        let data = result.data;
        let upCols = result.up_cols;
        let downCols = result.down_cols;
        let title = result.title;
        let upName = result.up_name;
        let downName = result.down_name;

        if(!data || data.length === 0){
            document.getElementById("tableContainer").innerHTML =
            `<div class="empty">无数据</div>`;
            return;
        }

        let html = `
            <table>
            <thead>
            <tr>
                <th rowspan="2">车号</th>
                <th colspan="${upCols.length}">${upName}</th>
                <th colspan="${downCols.length}">${downName}</th>
            </tr>
            <tr>
                ${upCols.map((_,i)=>`<th>${i+1}</th>`).join("")}
                ${downCols.map((_,i)=>`<th>${i+1}</th>`).join("")}
            </tr>
            </thead>
            <tbody>
            `;

        data.forEach((row,i)=>{

            html += "<tr>";

            // 假设数据顺序：
            // [班别, 头尾班, 上行1-5, 下行1-5]
            data.forEach(row => {

                html += "<tr>";
            
                html += `<td>${row["车号"]}</td>`;
            
                upCols.forEach(c => {
                    html += `<td>${row[c] || ""}</td>`;
                });
            
                downCols.forEach(c => {
                    html += `<td>${row[c] || ""}</td>`;
                });
            
                html += "</tr>";
            });

            values.forEach(v=>{
                html += `<td>${v}</td>`;
            });

            html += "</tr>";
        });

        html += "</tbody></table>";

        document.getElementById("tableContainer").innerHTML = html;

    }catch(e){
        document.getElementById("tableContainer").innerHTML =
        `<div class="empty">加载失败</div>`;
    }

}

</script>

</body>
</html>
